# Run orchestrator, board and isolated Factory CLI lifecycle regressions.
name: Tests

on:
  pull_request:
    branches: [main]
    # No `paths` filter: Factory only merges a PR after CI passes, so docs-only PRs need a run too.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test orchestrator/*.test.mts board/*.test.mts cli/test/*.test.mts
