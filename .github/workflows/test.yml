# Run isolated regressions with immediate TAP failure details and a bounded test deadline.
name: Tests

on:
  pull_request:
    branches: [main]
    # No `paths` filter: Factory only merges a PR after CI passes, so docs-only PRs need a run too.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolate browser probe lifecycle
        run: timeout --signal=KILL 30s node --test --test-reporter=tap --test-timeout=15000 orchestrator/browser-provisioning.test.mts
      - run: timeout --signal=KILL 180s node --test --test-reporter=tap --test-timeout=120000 orchestrator/*.test.mts board/*.test.mts cli/test/*.test.mts
