name: Tests

on:
  pull_request:
    branches: [main]
    # Only when code changes; docs, prompts and Dockerfile snippets don't need a test run.
    paths:
      - "**/*.mts"
      - "**/*.ts"
      - "**/*.js"
      - "**/*.cjs"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'orchestrator/*.test.mts'
