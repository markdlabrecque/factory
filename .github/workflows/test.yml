# Run every regular test once across bounded parallel shards, plus the isolated browser lifecycle gate.
name: Tests

on:
  pull_request:
    branches: [main]
    # No `paths` filter: Factory only merges a PR after CI passes, so docs-only PRs need a run too.

jobs:
  browser-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolate browser probe lifecycle
        run: timeout --signal=KILL 30s node --test --test-reporter=tap --test-timeout=15000 orchestrator/browser-provisioning.test.mts

  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run complete suite shard
        run: bash scripts/test-shard.sh ${{ matrix.shard }} 4

  # Keep the existing check name and fail closed on any failed, cancelled or skipped prerequisite.
  test:
    needs: [browser-lifecycle, suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          BROWSER_RESULT: ${{ needs.browser-lifecycle.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
        run: test "$BROWSER_RESULT" = success && test "$SUITE_RESULT" = success
