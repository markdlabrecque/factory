# Factory project settings, schema v1. Authoritative when present; no legacy fallback.
# Prompts, script bodies and credentials stay in separate files. Never put secrets here.
version = 1

[tracker]
kind = "github"
project = "owner/repo" # factory:project
host = "github.com"

[agent]
provider = "pi"
model = "pi-claude-subscription/claude-opus-5-5" # fixed verifier
thinking = "high" # Pi only: off|minimal|low|medium|high|xhigh
[agent.model_aliases]
"Sonnet 5.5" = "pi-claude-subscription/claude-sonnet-5-5"
sonnet = "pi-claude-subscription/claude-sonnet-5-5"
"Opus 5.5" = "pi-claude-subscription/claude-opus-5-5"
opus = "pi-claude-subscription/claude-opus-5-5"

[labels]
needs_human = "needs-human"
done = "merged"

[selection]
# All filters combine with AND. Omit optional filters to disable them; empty strings are invalid.
# milestone = "Sprint 1"
# assignee = "@me"
# author = "alice"
# search = "accessibility" # tracker-native search, not a local expression language
exclude_assignees = [] # any match vetoes, including multi-assignee tickets
[selection.labels]
all = ["ready-for-agent"] # [] means no required labels
none = ["blocked", "needs-human", "wontfix"] # [] means no label exclusions
[selection.order]
by = "created" # created|updated|popularity (priority only, not eligibility)
direction = "asc"

[work]
units = "subtasks" # issues|subtasks; selected parents confer eligibility on open children
[dispatch]
max_concurrent = 3 # checked against active runs across the SHARED board
stagger_seconds = 20
[merge]
auto = true # personal profile override; schema default is false
method = "squash"
required_checks = []
[graph]
model = "pi-claude-subscription/claude-sonnet-5-5"
max_analyses_per_pass = 5
analysis_timeout_minutes = 10
conflict_ignore = []
prune_after_days = 30
[ci]
wait_minutes = 30
no_pipeline_minutes = 5
[sandbox]
image = "sandcastle-personal" # factory:image
setup = [] # new projects retain empty setup; remove this line before adding tables below
# Startup commands are trusted project code, executed INSIDE the sandbox in order, never on the host.
# [[sandbox.setup]]
# command = '/opt/sandcastle/bootstrap-site.sh'
# timeout_ms = 600000 # optional; omitted preserves the sandbox default
# sudo = false
